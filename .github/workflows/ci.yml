name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet restore Pim.sln
      - run: dotnet build Pim.sln -c Release --no-restore
      - run: dotnet test Pim.sln -c Release --no-build --verbosity normal
      # Verificação de estilo: não bloqueia o pipeline até a base ser formatada uma vez (rode `dotnet format Pim.sln` localmente).
      - run: dotnet format Pim.sln --verify-no-changes --no-restore
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pim-api:ci .

  database-scripts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_senha
          POSTGRES_DB: pim
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: ci_senha
    steps:
      - uses: actions/checkout@v4
      - name: Executa pim_completo.sql duas vezes (idempotência)
        run: |
          psql -h localhost -U postgres -d pim -v ON_ERROR_STOP=1 -q -f database/pim_completo.sql
          psql -h localhost -U postgres -d pim -v ON_ERROR_STOP=1 -q -f database/pim_completo.sql
      - name: Teste de fumaça (triggers, procedures, restrições)
        run: psql -h localhost -U postgres -d pim -v ON_ERROR_STOP=1 -q -f database/tests/smoke_test.sql
