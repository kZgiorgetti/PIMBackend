# Uso: cp .env.example .env  (edite os segredos)  &&  docker compose up --build
# CORS_ORIGINS deve conter a(s) URL(s) do repositório pim-frontend (padrão: http://localhost:8080).
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Defina SA_PASSWORD no arquivo .env}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Executa database/pim_completo.sql (idempotente) e termina.
  db-init:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
    volumes:
      - ./database:/scripts:ro
    entrypoint: ["/bin/bash", "-c"]
    command: ["/opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P \"$$SA_PASSWORD\" -I -b -i /scripts/pim_completo.sql"]
    restart: "no"

  api:
    build: .
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Pim: "Server=sqlserver,1433;Database=PimDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@pim.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no arquivo .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      # TLS costuma ser terminado por um proxy reverso; em produção real, ative o redirecionamento HTTPS.
      Seguranca__ForcarHttps: "false"

volumes:
  sqldata:
