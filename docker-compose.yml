# Só a API: o banco é o Supabase (PostgreSQL gerenciado).
# Uso: cp .env.example .env  (preencha DB_CONNECTION, JWT_SECRET, ADMIN_PASSWORD)  &&  docker compose up --build
# CORS_ORIGINS deve conter a(s) URL(s) do repositório pim-frontend (padrão: http://localhost:8080).
services:
  api:
    build: .
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DB_CONNECTION: ${DB_CONNECTION:?Defina DB_CONNECTION no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@pim.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no arquivo .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      # TLS costuma ser terminado por um proxy reverso; em produção real, ative o redirecionamento HTTPS.
      Seguranca__ForcarHttps: "false"
