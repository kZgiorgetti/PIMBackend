# OPCIONAL: PostgreSQL local para desenvolver sem internet (não é usado em produção/entrega).
# Uso: docker compose -f docker-compose.yml -f docker-compose.localdb.yml up --build
# (com DB_CONNECTION="Host=db;Port=5432;Database=pim;Username=postgres;Password=postgres" no .env)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pim
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # o script roda automaticamente na primeira inicialização do volume
      - ./database/pim_completo.sql:/docker-entrypoint-initdb.d/01_pim_completo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pim"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
